comment: false

# Vendored third-party C code (libxlsxwriter and its bundled dependencies).
# Also excluded via .covrignore; this is a Codecov-side backstop in case any
# vendored path still reaches the uploaded report.
ignore:
  - "src/libxlsxwriter"
  - "src/libxlsxwriter/**/*"

coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
        informational: true
    patch:
      default:
        target: auto
        threshold: 1%
        informational: true
